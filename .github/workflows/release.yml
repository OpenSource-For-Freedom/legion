name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            archive: zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip

    steps:
      - uses: actions/checkout@c915c33a16f01166c17c4e35fe1d4085a2d71adb # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install musl-tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(grep -E '^\s*version\s*=' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Pushed tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}." >&2
            echo "Bump Cargo.toml to match the tag (single source of truth)." >&2
            exit 1
          fi

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --package legion-cli --package legion-tui --package legion-web

      - name: Package artifacts
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STEM="legion-${TAG}-${{ matrix.target }}"
          BIN_DIR="dist/${STEM}"
          mkdir -p "$BIN_DIR"

          # Ship ONLY the executable app (legion-web, the dashboard) + README + LICENSE.
          cp "target/${{ matrix.target }}/release/legion-web${{ matrix.ext }}" "$BIN_DIR/"
          cp README.md "$BIN_DIR/" 2>/dev/null || true
          cp LICENSE   "$BIN_DIR/" 2>/dev/null || true

          cd dist
          tar -czf "${STEM}.tar.gz" "${STEM}"
          sha256sum "${STEM}.tar.gz" > "${STEM}.tar.gz.sha256"

      # Linux desktop deliverable: one double-clickable AppImage (static runtime,
      # so no libfuse2 needed on the user's machine). See scripts/build-appimage.sh.
      - name: Build AppImage (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          TAG="${GITHUB_REF_NAME}"
          chmod +x scripts/build-appimage.sh
          scripts/build-appimage.sh \
            "target/${{ matrix.target }}/release/legion-web" \
            "dist/Legion-${TAG}-x86_64.AppImage"
          ( cd dist && sha256sum "Legion-${TAG}-x86_64.AppImage" > "Legion-${TAG}-x86_64.AppImage.sha256" )

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.AppImage
          generate_release_notes: true
