name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            archive: zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install musl-tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install 7z (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y p7zip-full

      - name: Install 7z (macOS)
        if: runner.os == 'macOS'
        run: brew install p7zip

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: |
          cargo build --release --package legion-web  --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STEM="legion-${TAG}-${{ matrix.target }}"
          BIN_DIR="dist/${STEM}"
          mkdir -p "$BIN_DIR"

          cp "target/${{ matrix.target }}/release/legion-web${{ matrix.ext }}"  "$BIN_DIR/"

          # Copy docs for the packaged app bundle
          cp README.md "$BIN_DIR/" 2>/dev/null || true
          cp LICENSE "$BIN_DIR/" 2>/dev/null || true
          cp NOTICE  "$BIN_DIR/" 2>/dev/null || true

          # Linux: ship the bash launcher + desktop integration (no PowerShell).
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            cp scripts/legion-launch.sh   "$BIN_DIR/"
            cp scripts/install-desktop.sh "$BIN_DIR/"
            cp assets/legion-icon.svg     "$BIN_DIR/" 2>/dev/null || true
            cp assets/legion-icon.png     "$BIN_DIR/" 2>/dev/null || true
            chmod +x "$BIN_DIR/legion-launch.sh" "$BIN_DIR/install-desktop.sh"
          fi

          cd dist
          7z a -tzip "${STEM}.zip" "${STEM}" > /dev/null
          echo "ARCHIVE=dist/${STEM}.zip" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
