name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Manual dry run: build, validate and package every target WITHOUT publishing,
  # so the release pipeline can be exercised (and its badge turned green) between
  # tagged releases. The publish + tag-guard steps below are gated to tag pushes,
  # so a dispatch run never creates or uploads a GitHub Release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip

    steps:
      - name: Legion Harden Runner
        uses: Wraith-security/Legion_runner@29bd7988b50952f2056638bab3edf5802c468a64 # v1.0.42
        with:
          egress-policy: audit
          learn: 'true'
          policy-file: .legion/egress-allowed.txt
          allowed-presets: 'cargo, rust'
          ebpf: auto
          file-integrity: 'true'
      - uses: actions/checkout@c915c33a16f01166c17c4e35fe1d4085a2d71adb # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install musl-tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Verify tag matches Cargo.toml version
        # Only meaningful for a tag push; a manual dispatch has no tag to match.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(grep -E '^\s*version\s*=' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Pushed tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}." >&2
            echo "Bump Cargo.toml to match the tag (single source of truth)." >&2
            exit 1
          fi

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --package legion-cli --package legion-tui --package legion-web

      - name: Package artifacts
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STEM="legion-${TAG}-${{ matrix.target }}"
          BIN_DIR="dist/${STEM}"
          mkdir -p "$BIN_DIR"

          # Ship ONLY the executable app (legion-web, the dashboard) + README + LICENSE.
          cp "target/${{ matrix.target }}/release/legion-web${{ matrix.ext }}" "$BIN_DIR/"
          cp README.md "$BIN_DIR/" 2>/dev/null || true
          cp LICENSE   "$BIN_DIR/" 2>/dev/null || true

          cd dist
          # Honour the matrix `archive` key. It was declared and then ignored:
          # both targets shipped .tar.gz, so Windows users got a tarball they
          # cannot open without extra tooling, while the config claimed zip.
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${STEM}.zip" "${STEM}" >/dev/null
            sha256sum "${STEM}.zip" > "${STEM}.zip.sha256"
          else
            tar -czf "${STEM}.tar.gz" "${STEM}"
            sha256sum "${STEM}.tar.gz" > "${STEM}.tar.gz.sha256"
          fi

      # Linux desktop deliverable: one double-clickable AppImage (static runtime,
      # so no libfuse2 needed on the user's machine). See scripts/build-appimage.sh.
      - name: Build AppImage (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          TAG="${GITHUB_REF_NAME}"
          chmod +x scripts/build-appimage.sh
          scripts/build-appimage.sh \
            "target/${{ matrix.target }}/release/legion-web" \
            "dist/Legion-${TAG}-x86_64.AppImage"
          ( cd dist && sha256sum "Legion-${TAG}-x86_64.AppImage" > "Legion-${TAG}-x86_64.AppImage.sha256" )

      # Windows deliverable beyond a raw archive: a winget manifest set, so
      # `winget install Legion.Legion` works and updates flow through winget
      # rather than the user re-downloading a tarball by hand.
      - name: Generate winget manifests (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          STEM="legion-${TAG}-${{ matrix.target }}"
          SHA=$(sha256sum "dist/${STEM}.zip" | cut -d' ' -f1 | tr 'a-f' 'A-F')
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${STEM}.zip"
          mkdir -p dist/winget
          for f in packaging/winget/*.yaml; do
            out="dist/winget/$(basename "$f")"
            sed -e "s|__VERSION__|${VERSION}|g" \
                -e "s|__VERSION_TAG__|${TAG}|g" \
                -e "s|__URL__|${URL}|g" \
                -e "s|__SHA256__|${SHA}|g" "$f" > "$out"
          done
          echo "winget manifests:"; ls -1 dist/winget

      # Windows desktop deliverable: the bare, double-clickable dashboard exe,
      # mirroring the Linux AppImage, so Windows users get a "just run it"
      # download and not only a .zip they must extract first.
      - name: Stage standalone exe (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp "target/${{ matrix.target }}/release/legion-web.exe" "dist/Legion-${TAG}-x86_64.exe"
          ( cd dist && sha256sum "Legion-${TAG}-x86_64.exe" > "Legion-${TAG}-x86_64.exe.sha256" )

      - name: Upload release assets
        # Publish ONLY for real tag pushes. A manual dispatch is a build/validate
        # dry run and must never create or mutate a GitHub Release.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.sha256
            dist/*.AppImage
            dist/winget/*.yaml
          generate_release_notes: true
