name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            archive: zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install musl-tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Install 7z (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y p7zip-full

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release binary
        run: |
          cargo build --release --package legion-web  --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STEM="legion-${TAG}-${{ matrix.target }}"
          BIN_DIR="dist/${STEM}"
          mkdir -p "$BIN_DIR"

          # The zip is the plain binary + docs for headless / server / CLI use.
          # Linux desktop users get the clickable AppImage built below instead.
          cp "target/${{ matrix.target }}/release/legion-web${{ matrix.ext }}"  "$BIN_DIR/"
          cp README.md "$BIN_DIR/" 2>/dev/null || true
          cp LICENSE "$BIN_DIR/" 2>/dev/null || true
          cp NOTICE  "$BIN_DIR/" 2>/dev/null || true

          cd dist
          7z a -tzip "${STEM}.zip" "${STEM}" > /dev/null

      # Linux desktop deliverable: one double-clickable AppImage (static runtime,
      # so no libfuse2 needed on the user's machine). See scripts/build-appimage.sh.
      - name: Build AppImage (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          TAG="${GITHUB_REF_NAME}"
          chmod +x scripts/build-appimage.sh
          scripts/build-appimage.sh \
            "target/${{ matrix.target }}/release/legion-web" \
            "dist/Legion-${TAG}-x86_64.AppImage"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.AppImage
          generate_release_notes: true
