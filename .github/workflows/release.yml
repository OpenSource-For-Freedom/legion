name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            archive: zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build all three binaries
        run: |
          cargo build --release --package legion-cli --target ${{ matrix.target }}
          cargo build --release --package legion-tui  --target ${{ matrix.target }}
          cargo build --release --package legion-web  --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STEM="legion-${TAG}-${{ matrix.target }}"
          BIN_DIR="dist/${STEM}"
          mkdir -p "$BIN_DIR"

          # Copy the three application binaries
          cp "target/${{ matrix.target }}/release/legion${{ matrix.ext }}"      "$BIN_DIR/"
          cp "target/${{ matrix.target }}/release/legion-tui${{ matrix.ext }}"  "$BIN_DIR/"
          cp "target/${{ matrix.target }}/release/legion-web${{ matrix.ext }}"  "$BIN_DIR/"

          # Copy docs for the packaged app bundle
          cp README.md "$BIN_DIR/" 2>/dev/null || true
          cp LICENSE "$BIN_DIR/" 2>/dev/null || true
          cp assets/legion.png "$BIN_DIR/" 2>/dev/null || true

          cd dist
          7z a -tzip "${STEM}.zip" "${STEM}" > /dev/null
          echo "ARCHIVE=dist/${STEM}.zip" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
