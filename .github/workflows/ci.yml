name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Least-privilege default for GITHUB_TOKEN across all jobs (CI only reads).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust test & lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable]
    steps:
      - name: Legion Harden Runner
        uses: Wraith-security/Legion_runner@29bd7988b50952f2056638bab3edf5802c468a64 # v1.0.42
        with:
          egress-policy: audit
          learn: 'true'
          policy-file: .legion/egress-allowed.txt
          ebpf: auto
          file-integrity: 'true'
          allowed-presets: 'cargo, rust'
      - uses: actions/checkout@c915c33a16f01166c17c4e35fe1d4085a2d71adb # v4
      

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (channel via with.toolchain)
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Cargo build (release)
        run: cargo build --release --package legion-cli --package legion-tui --package legion-web

  c-agent-linux:
    name: C agent (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Legion Harden Runner
        uses: Wraith-security/Legion_runner@29bd7988b50952f2056638bab3edf5802c468a64 # v1.0.42
        with:
          egress-policy: audit
          learn: 'true'
          policy-file: .legion/egress-allowed.txt
          ebpf: auto
          file-integrity: 'true'
          allowed-presets: 'apt'
      - uses: actions/checkout@c915c33a16f01166c17c4e35fe1d4085a2d71adb # v4
      - name: Build C agent
        working-directory: agents
        run: make all CC=gcc CFLAGS="-O2 -Wall -std=gnu11"
      - name: Run C agent tests
        working-directory: agents
        run: |
          gcc -O2 -Wall -std=gnu11 -DLEGION_NO_MAIN -I./include -o build/test_agent tests/test_agent.c src/agent.c
          ./build/test_agent

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Legion Harden Runner
        uses: Wraith-security/Legion_runner@29bd7988b50952f2056638bab3edf5802c468a64 # v1.0.42
        with:
          egress-policy: audit
          learn: 'true'
          policy-file: .legion/egress-allowed.txt
          ebpf: auto
          file-integrity: 'true'
          allowed-presets: 'cargo, rust'
      - uses: actions/checkout@c915c33a16f01166c17c4e35fe1d4085a2d71adb # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Legion Harden Runner
        uses: Wraith-security/Legion_runner@29bd7988b50952f2056638bab3edf5802c468a64 # v1.0.42
        with:
          egress-policy: audit
          learn: 'true'
          policy-file: .legion/egress-allowed.txt
          ebpf: auto
          file-integrity: 'true'
          allowed-presets: 'cargo, rust'
      - uses: actions/checkout@c915c33a16f01166c17c4e35fe1d4085a2d71adb # v4
      - name: cargo-deny (advisories, bans, sources, licenses)
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87 # v2
        with:
          command: check advisories bans sources licenses

  ares-model:
    name: Ares model distribution
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Legion Harden Runner
        uses: Wraith-security/Legion_runner@29bd7988b50952f2056638bab3edf5802c468a64 # v1.0.42
        with:
          egress-policy: audit
          learn: 'true'
          policy-file: .legion/egress-allowed.txt
          ebpf: auto
          file-integrity: 'true'
          allowed-presets: 'cargo, rust'
      - uses: actions/checkout@c915c33a16f01166c17c4e35fe1d4085a2d71adb # v4
      # Confirms the model the built app will pull on this OS is actually
      # reachable and intact: validate the manifest, then for every published
      # tier HEAD the HuggingFace URL and check the size matches. Unpublished
      # tiers (empty sha256) are skipped — the app falls back to a local base.
      - name: Verify Ares model manifest and endpoint
        shell: bash
        run: |
          set -euo pipefail
          manifest=agents/ares/models/manifest.json
          jq empty "$manifest"
          # jq's Windows build writes CRLF to stdout; strip the CR so keys/values
          # don't carry a trailing \r (a bare \r turns a key lookup into null and
          # a URL into an unresolvable host). Linux jq is already clean.
          published=$(jq -r '.tiers | to_entries[] | select(.value.sha256 != "") | .key' "$manifest" | tr -d '\r')
          if [ -z "$published" ]; then
            echo "No published tiers yet (sha256 empty) — app uses the local base build. OK."
            exit 0
          fi
          rc=0
          for tier in $published; do
            url=$(jq -r --arg t "$tier" '.tiers[$t].url' "$manifest" | tr -d '\r')
            want=$(jq -r --arg t "$tier" '.tiers[$t].size_bytes' "$manifest" | tr -d '\r')
            echo "checking $tier -> $url"
            code=$(curl -fsSL -r 0-0 -o /dev/null -w '%{http_code}' "$url" || echo "000")
            len=$(curl -fsSIL "$url" | tr -d '\r' | awk 'tolower($1)=="content-length:"{v=$2} END{print v+0}')
            echo "  http=$code content-length=$len want=$want"
            if [ "$code" != "200" ] && [ "$code" != "206" ]; then
              echo "  FAIL: $tier endpoint not reachable"; rc=1; continue
            fi
            if [ "$want" != "0" ] && [ "$len" != "0" ] && [ "$len" != "$want" ]; then
              echo "  FAIL: $tier size mismatch (manifest $want, server $len)"; rc=1
            fi
          done
          exit $rc
