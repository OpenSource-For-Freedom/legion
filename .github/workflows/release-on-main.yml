name: Release on main

# Every push to main is validated across all shipping targets; if the builds and
# tests pass, a new patch-bumped tag is cut and the cross-platform binaries are
# published to a GitHub Release. Larger version bumps: push a tag manually
# (release.yml handles that) — this workflow only auto-increments the patch.

on:
  push:
    branches: [main]

# Serialize releases so two quick pushes can't race on the same tag.
concurrency:
  group: release-on-main
  cancel-in-progress: false

# Least privilege by default (L6): only the release job that publishes needs
# write; the version/build jobs read. Write is granted per-job below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── 1. Derive the version from Cargo.toml (single source of truth) ──────────
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      exists: ${{ steps.next.outputs.exists }}
    steps:
      - name: Legion Harden Runner
        uses: Wraith-security/Legion_runner@29bd7988b50952f2056638bab3edf5802c468a64 # v1.0.42
        with:
          egress-policy: audit
          learn: 'true'
          policy-file: .legion/egress-allowed.txt
          ebpf: auto
          file-integrity: 'true'
          allowed-presets: 'cargo, rust'
      - uses: actions/checkout@c915c33a16f01166c17c4e35fe1d4085a2d71adb # v4
        with:
          fetch-depth: 0  # need full tag history

      - name: Derive tag from Cargo.toml version
        id: next
        run: |
          # Cargo.toml [workspace.package] version is the single source of truth.
          version=$(grep -E '^\s*version\s*=' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          tag="v${version}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "Cargo version: $version -> tag $tag (already published: $exists)"

  # ── 2. Validate + build release artifacts for every shipping target ─────────
  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            archive: zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip
    steps:
      - name: Legion Harden Runner
        uses: Wraith-security/Legion_runner@29bd7988b50952f2056638bab3edf5802c468a64 # v1.0.42
        with:
          egress-policy: audit
          learn: 'true'
          policy-file: .legion/egress-allowed.txt
          allowed-presets: 'cargo, rust, apt'
          ebpf: auto
          file-integrity: 'true'
      - uses: actions/checkout@c915c33a16f01166c17c4e35fe1d4085a2d71adb # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Install musl-tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # ── validation gate ──────────────────────────────────────────────────
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # ── release build for this target ────────────────────────────────────
      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --package legion-cli --package legion-tui --package legion-web

      # M6: CycloneDX SBOM for the shipped workspace, generated once (Linux).
      - name: Generate SBOM (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
          mkdir -p dist
          # Collect the per-crate SBOMs into one release asset.
          cp "$(find . -name '*.cdx.json' -path '*legion-web*' | head -1)" \
             "dist/legion-${TAG}-sbom.cdx.json"

      - name: Build AppImage (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          chmod +x scripts/build-appimage.sh
          scripts/build-appimage.sh \
            "target/${{ matrix.target }}/release/legion-web" \
            "dist/Legion-${TAG}-x86_64.AppImage"
          ( cd dist && sha256sum "Legion-${TAG}-x86_64.AppImage" > "Legion-${TAG}-x86_64.AppImage.sha256" )

      - name: Package artifact
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          STEM="legion-${TAG}-${{ matrix.target }}"
          BIN_DIR="dist/${STEM}"
          mkdir -p "$BIN_DIR"

          # Ship ONLY the executable app (legion-web, the dashboard) + README + LICENSE.
          cp "target/${{ matrix.target }}/release/legion-web${{ matrix.ext }}" "$BIN_DIR/"
          cp README.md "$BIN_DIR/" 2>/dev/null || true
          cp LICENSE   "$BIN_DIR/" 2>/dev/null || true

          # Ship the AppImage inside the archive too, so the release folder
          # contains the double-clickable app and not just a bare binary.
          if compgen -G "dist/Legion-*-x86_64.AppImage" > /dev/null; then
            cp dist/Legion-*-x86_64.AppImage "$BIN_DIR/" && chmod +x "$BIN_DIR"/Legion-*.AppImage
          fi

          cd dist
          tar -czf "${STEM}.tar.gz" "${STEM}"
          sha256sum "${STEM}.tar.gz" > "${STEM}.tar.gz.sha256"

      # Linux desktop deliverable: one double-clickable AppImage (static runtime,
      # so no libfuse2 needed on the user's machine). See scripts/build-appimage.sh.
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legion-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.AppImage
            dist/*sbom*.json
          if-no-files-found: error
          retention-days: 7

  # ── 3. Tag + publish the release ────────────────────────────────────────────
  # Only runs when Cargo.toml's version is new (its tag does not yet exist), so a
  # release is a deliberate version bump rather than an every-push event. Build +
  # tests above still run on every push as the validation gate.
  release:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    # L6: write is scoped to just this job. id-token/attestations enable M6
    # build-provenance attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Legion Harden Runner
        uses: Wraith-security/Legion_runner@29bd7988b50952f2056638bab3edf5802c468a64 # v1.0.42
        with:
          egress-policy: audit
          learn: 'true'
          policy-file: .legion/egress-allowed.txt
          # GitHub-only job: allow-github covers it, no preset needed.
          ebpf: auto
          file-integrity: 'true'
      - uses: actions/checkout@c915c33a16f01166c17c4e35fe1d4085a2d71adb # v4

      - name: Create and push git tag
        # L7: pass the derived tag via env, not `${{ }}` inlined into the shell,
        # so a crafted version value can't be substituted into the command.
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # M6: cryptographically tie every published artifact to this repo + build.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.AppImage

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          TAG: ${{ needs.version.outputs.tag }}
        with:
          tag_name: ${{ env.TAG }}
          name: Legion ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.sha256
            dist/*sbom*.json
            dist/*.AppImage
