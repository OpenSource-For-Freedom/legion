<?xml version="1.0" encoding="UTF-8"?>
<svg width="1120" height="180" viewBox="0 0 1120 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How Legion works: watch, check, alert, explain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d1e"/>
      <stop offset="1" stop-color="#1b1b38"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6bf0"/>
      <stop offset="1" stop-color="#173a9e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7c558"/>
      <stop offset="1" stop-color="#b8901f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1120" height="180" rx="18" fill="url(#bg)"/>
  <rect x="4" y="4" width="1112" height="172" rx="15" fill="none" stroke="#2b2b50" stroke-width="2"/>

  <g stroke="#3a4a80" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M250 80 L300 80"/><path d="M292 72 l10 8 l-10 8"/>
    <path d="M530 80 L580 80"/><path d="M572 72 l10 8 l-10 8"/>
    <path d="M810 80 L860 80"/><path d="M852 72 l10 8 l-10 8"/>
  </g>

  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(130,60)">
      <circle r="34" fill="url(#blue)" stroke="#9db8e8" stroke-width="2"/>
      <path d="M-18 0 Q0 -15 18 0 Q0 15 -18 0 Z" fill="none" stroke="#fff" stroke-width="3"/>
      <circle r="6" fill="#fff"/>
    </g>
    <text x="130" y="122" fill="#f4f6fb" font-size="19" font-weight="700" letter-spacing="1">WATCH</text>
    <text x="130" y="144" fill="#9fb3c8" font-size="13">packages, files, network</text>

    <g transform="translate(410,60)">
      <circle r="34" fill="url(#blue)" stroke="#9db8e8" stroke-width="2"/>
      <circle cx="-4" cy="-4" r="12" fill="none" stroke="#fff" stroke-width="3"/>
      <line x1="6" y1="6" x2="15" y2="15" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="410" y="122" fill="#f4f6fb" font-size="19" font-weight="700" letter-spacing="1">CHECK</text>
    <text x="410" y="144" fill="#9fb3c8" font-size="13">CVEs, YARA, drift</text>

    <g transform="translate(690,60)">
      <circle r="34" fill="url(#gold)" stroke="#f3e2a6" stroke-width="2"/>
      <path d="M0 -16 L16 14 L-16 14 Z" fill="none" stroke="#1b1b38" stroke-width="3" stroke-linejoin="round"/>
      <line x1="0" y1="-4" x2="0" y2="6" stroke="#1b1b38" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="11" r="1.8" fill="#1b1b38"/>
    </g>
