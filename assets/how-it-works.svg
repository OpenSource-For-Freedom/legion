    <text x="690" y="144" fill="#9fb3c8" font-size="13">ranked, in plain text</text>

    <g transform="translate(970,60)">
      <circle r="34" fill="url(#blue)" stroke="#9db8e8" stroke-width="2"/>
      <rect x="-17" y="-13" width="34" height="22" rx="6" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M-6 9 L-2 16 L4 9 Z" fill="#fff"/>
      <line x1="-10" y1="-4" x2="10" y2="-4" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-10" y1="3" x2="4" y2="3" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="970" y="122" fill="#f4f6fb" font-size="19" font-weight="700" letter-spacing="1">EXPLAIN</text>
