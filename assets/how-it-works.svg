<?xml version="1.0" encoding="UTF-8"?>
<svg width="1180" height="230" viewBox="0 0 1180 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How Legion works: watch, check, alert, explain">
  <title>How Legion works</title>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12122a"/>
      <stop offset="1" stop-color="#181834"/>
    </linearGradient>
    <style>
      .ttl { font-family:'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif; font-weight:800; font-size:22px; letter-spacing:1px; }
      .sub { font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-weight:400; font-size:15px; fill:#aab6cc; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="230" rx="18" fill="url(#hbg)"/>
  <rect x="5" y="5" width="1170" height="220" rx="14" fill="none" stroke="#2b2b50" stroke-width="1.5"/>

  <!-- arrows between cards -->
  <g stroke="#5566aa" stroke-width="3" fill="none">
    <path d="M278 115 h26" marker-end="url(#ah)"/>
    <path d="M568 115 h26" marker-end="url(#ah)"/>
    <path d="M858 115 h26" marker-end="url(#ah)"/>
  </g>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5566aa"/>
    </marker>
  </defs>

  <!-- Card 1: WATCH (cyan) -->
  <g>
    <rect x="22" y="42" width="252" height="146" rx="14" fill="#161630" stroke="#2b6fa6" stroke-width="1.5"/>
    <ellipse cx="60" cy="86" rx="20" ry="13" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="60" cy="86" r="6" fill="#38bdf8"/>
    <text class="ttl" x="92" y="92" fill="#7cc6f5">WATCH</text>
    <text class="sub" x="40" y="132">Keeps an eye on your</text>
    <text class="sub" x="40" y="153">packages, files, and</text>
    <text class="sub" x="40" y="174">network connections.</text>
  </g>

  <!-- Card 2: CHECK (blue) -->
  <g>
    <rect x="312" y="42" width="252" height="146" rx="14" fill="#161630" stroke="#3a63b0" stroke-width="1.5"/>
    <circle cx="58" cy="84" r="13" fill="none" stroke="#6aa3f0" stroke-width="3" transform="translate(312,0)"/>
    <line x1="380" y1="96" x2="392" y2="108" stroke="#6aa3f0" stroke-width="3"/>
    <text class="ttl" x="392" y="92" fill="#8fb6f3">CHECK</text>
    <text class="sub" x="330" y="132">Matches them against</text>
    <text class="sub" x="330" y="153">live threat feeds and</text>
    <text class="sub" x="330" y="174">YARA detection rules.</text>
  </g>

  <!-- Card 3: ALERT (amber) -->
  <g>
    <rect x="602" y="42" width="252" height="146" rx="14" fill="#161630" stroke="#8a6a1f" stroke-width="1.5"/>
    <path d="M650 96 L666 68 L682 96 Z" fill="none" stroke="#f3b03c" stroke-width="3" stroke-linejoin="round"/>
    <line x1="666" y1="78" x2="666" y2="89" stroke="#f3b03c" stroke-width="3"/>
    <circle cx="666" cy="93" r="1.6" fill="#f3b03c"/>
    <text class="ttl" x="700" y="92" fill="#f3c460">ALERT</text>
    <text class="sub" x="620" y="132">Flags anything risky</text>
    <text class="sub" x="620" y="153">and ranks it by how</text>
    <text class="sub" x="620" y="174">serious it is.</text>
  </g>

  <!-- Card 4: EXPLAIN / ARES (green) -->
  <g>
    <rect x="892" y="42" width="262" height="146" rx="14" fill="#161630" stroke="#2c7a4f" stroke-width="1.5"/>
    <path d="M926 74 h44 a8 8 0 0 1 8 8 v18 a8 8 0 0 1 -8 8 h-26 l-12 12 v-12 h-6 a8 8 0 0 1 -8 -8 v-18 a8 8 0 0 1 8 -8 z"
          fill="none" stroke="#36d399" stroke-width="3" stroke-linejoin="round"/>
    <text class="ttl" x="992" y="92" fill="#7ee5b4">EXPLAIN</text>
    <text class="sub" x="910" y="132">Ares, your on-device</text>
    <text class="sub" x="910" y="153">analyst, tells you what</text>
    <text class="sub" x="910" y="174">it means in plain words.</text>
  </g>
</svg>
