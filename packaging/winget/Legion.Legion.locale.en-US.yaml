ShortDescription: Local SIEM/SOAR security monitor with an on-device AI threat hunter.
Description: >-
  Legion is a local-first SIEM/SOAR console. It scans package trees against OSV
  and CISA KEV, runs a pure-Rust YARA engine, watches for confirmed-malicious
  dependencies, and carries ARES, a threat-hunting agent that runs a local model
  on the machine. Nothing leaves the host: the dashboard binds to loopback and
  the model server runs locally.
