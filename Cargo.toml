[workspace]
members = [
    "crates/legion-core",
    "crates/legion-cli",
    "crates/legion-tui",
    "crates/legion-web",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["Legion Contributors"]
license      = "MIT"
repository   = "https://github.com/tbgor/legion"
description  = "Legion SIEM/SOAR – package & IP security monitor"

[workspace.dependencies]
# async
tokio            = { version = "1",    features = ["full"] }
# HTTP – rustls so no system OpenSSL needed
reqwest          = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# serialization
serde            = { version = "1",    features = ["derive"] }
serde_json       = "1"
# database (bundled SQLite – no external dep)
rusqlite         = { version = "0.31", features = ["bundled"] }
# datetime
chrono           = { version = "0.4",  features = ["serde"] }
# error handling
anyhow           = "1"
thiserror        = "1"
# logging
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# CLI
clap             = { version = "4",    features = ["derive", "color", "wrap_help", "env"] }
# TUI
ratatui          = "0.28"
crossterm        = "0.28"
# system info (cross-platform: Linux / macOS / Windows)
sysinfo          = "0.31"
# web server
axum             = "0.7"
tower-http       = { version = "0.5", features = ["cors"] }
open             = "5"
