# cargo-deny configuration — supply-chain controls for Legion.
# Run locally with: cargo deny check advisories bans sources
# CI runs the same via the cargo-deny GitHub action.

[advisories]
version = 2
# Fail on crates pulled from a source that has yanked the exact version.
yanked = "deny"
# Accepted, tracked exceptions (see COMPLIANCE.md "Accepted exceptions"):
# both are low-severity, transitive, TUI-only advisories arriving via ratatui
# with no upstream fix reachable. Re-evaluate on each ratatui update.
ignore = [
    "RUSTSEC-2024-0436", # paste — unmaintained (not a vulnerability)
    "RUSTSEC-2026-0002", # lru — IterMut unsoundness; fixed in 0.13, ratatui pins ^0.12
]

[bans]
# Surface (do not hard-fail on) duplicate transitive versions and wildcard
# version requirements — useful signal without blocking routine updates.
multiple-versions = "warn"
wildcards = "warn"
# Disallow crates known to be unmaintained/dangerous wrappers here if needed.
deny = []

[sources]
# Only allow dependencies from crates.io; reject unknown registries / git deps
# to prevent dependency-confusion and unvetted source pulls (OWASP A08).
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
